<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SteamTwo: catálogo e rankings transparentes de jogos da Steam e Epic Games." />
    <meta name="theme-color" content="#080c11" />
    <title>SteamTwo — Catálogo e rankings de jogos</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("steamtwo:theme");
          var theme = stored || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
